    <title>Ken's Portfolio | PROJECTS</title>
    <script>
        if (localStorage.getItem('color-theme') === 'light') {
            document.documentElement.classList.remove('dark');
        } else {
            document.documentElement.classList.add('dark');
        }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { primary: '#0f172a', secondary: '#f8fafc' }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="csspage/style.css">

                </div>
            </div>
        </div>
        <div id="mobile-menu" class="hidden md:hidden border-t border-gray-300 dark:border-gray-800/60 bg-gray-200/95 dark:bg-slate-900/95 backdrop-blur-md">
            <div class="px-6 py-4 space-y-2 flex flex-col">

            <div id="img-paete-cms" class="project-image-slide absolute inset-0 w-full h-full flex items-center justify-center">
                <img src="img/project_me1.jpg" alt="CMS Paete Landing Page" class="w-full h-full object-contain p-4">
            </div>
            <div id="img-paete-hydration" class="project-image-slide absolute inset-0 w-full h-full flex items-center justify-center">
                <img src="img/project_me2.jpg" alt="Paete Dynamic Page Hydration" class="w-full h-full object-contain p-4">
            </div>
            <div id="img-green-future" class="project-image-slide absolute inset-0 w-full h-full flex items-center justify-center">

            </div>
            <div id="img-placeholder" class="absolute inset-0 flex items-center justify-center transition-opacity duration-500 opacity-100 bg-gray-200/20 dark:bg-gray-800/20">
                <p class="text-gray-600 dark:text-gray-400 font-mono text-sm tracking-widest uppercase">Hover projects to Preview</p>
            </div>
        </div>

            <div class="mb-10">
                <h1 class="text-5xl md:text-7xl font-black tracking-tighter text-gray-900 dark:text-white leading-tight">
                    Project<br><span class="text-blue-500">Section.</span>
                </h1>
                <p class="mt-4 font-mono text-xs tracking-widest text-gray-500 uppercase">Hover to view &bull; Click to explore</p>
            </div>

                <button class="project-list-item group flex justify-between items-center py-10 border-b border-gray-300 dark:border-gray-800 text-left transition-colors duration-300" data-project="paete-cms">
                    <h2 class="text-3xl md:text-4xl font-black tracking-tighter text-gray-800 dark:text-gray-300 group-hover:text-blue-500 transition-colors duration-300">CMS PAETE LANDING</h2>
                    <span class="text-xs font-mono text-gray-500 w-1/3 text-right group-hover:text-gray-900 dark:group-hover:text-white transition-colors duration-300">BB88 WEB &amp; CMS</span>
                </button>

                <button class="project-list-item group flex justify-between items-center py-10 border-b border-gray-300 dark:border-gray-800 text-left transition-colors duration-300" data-project="paete-hydration">
                    <h2 class="text-3xl md:text-4xl font-black tracking-tighter text-gray-800 dark:text-gray-300 group-hover:text-teal-400 transition-colors duration-300">PAETE ES6 HYDRATION</h2>

                <button class="project-list-item group flex justify-between items-center py-10 border-b border-gray-300 dark:border-gray-800 text-left transition-colors duration-300" data-project="green-future">

        <div class="relative w-full max-w-4xl bg-white dark:bg-primary border border-gray-200 dark:border-gray-700 rounded-2xl shadow-2xl p-8 md:p-12 flex flex-col md:flex-row gap-10">
            <button id="close-modal-btn" class="absolute top-6 right-6 text-gray-500 hover:text-red-500 transition-colors">

                <p id="modal-desc" class="text-gray-600 dark:text-gray-400 leading-relaxed"></p>
